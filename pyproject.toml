[project]
name = "apple-silicon-llm-serving-lab"
version = "0.1.0"
description = "Measured production-style LLM serving experiments on Apple Silicon"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "matplotlib>=3.10,<4",
  "orjson>=3.10,<4",
  "prometheus-client>=0.22,<1",
  "psutil>=7,<8",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "structlog>=25.4,<26",
  "typer>=0.16,<1",
  "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
  "types-psutil>=7,<8",
]
telemetry = [
  "opentelemetry-api>=1.36,<2",
  "opentelemetry-exporter-otlp-proto-grpc>=1.36,<2",
  "opentelemetry-instrumentation-fastapi>=0.57b0,<1",
  "opentelemetry-sdk>=1.36,<2",
]

[tool.pytest.ini_options]
testpaths = ["benchmark/tests", "gateway/tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["benchmark", "evaluation", "gateway", "pipeline_b", "pipeline_3", "comparison"]
